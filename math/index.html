<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magical Math Garden</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",system-ui,sans-serif;color:#543b57;background:linear-gradient(#bdeaff 0 30%,#dff7e3 72%,#bfe5b7);overflow-x:hidden}
.wrap{width:min(820px,96%);margin:10px auto 25px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.home,.music{width:52px;height:52px;border-radius:18px;border:4px solid white;background:#fff1fa;color:#76517a;font-size:25px;box-shadow:0 4px #d8b7cf;cursor:pointer}.music.off{opacity:.5}
.sign{flex:1;text-align:center;background:#fff9e8;border:4px solid #d5a77d;border-radius:22px;padding:8px 12px;box-shadow:0 5px #b88967}
.sign b{font-size:clamp(22px,5vw,34px);color:#704b55}.sign small{display:block;color:#8a6570}
.sky{position:relative;height:245px;margin-top:8px;border-radius:30px 30px 0 0;overflow:hidden}
.cloud{position:absolute;font-size:45px;opacity:.8;animation:cloud 10s linear infinite}.c1{left:5%;top:18%}.c2{right:8%;top:10%;animation-delay:4s}
@keyframes cloud{50%{transform:translateX(25px)}}
.sun{position:absolute;right:9%;top:12px;font-size:52px}
.ground{position:absolute;bottom:-50px;left:-5%;width:110%;height:150px;background:#94d38f;border-radius:50% 50% 0 0}
.f{position:absolute;bottom:25px;font-size:38px;z-index:2;animation:sway 2s ease-in-out infinite}.f1{left:7%}.f2{left:20%;animation-delay:.3s}.f3{right:22%;animation-delay:.7s}.f4{right:7%;animation-delay:1s}
@keyframes sway{50%{transform:rotate(7deg) translateY(-3px)}}
.cast{position:absolute;z-index:4;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:18px}.char{font-size:73px;filter:drop-shadow(0 5px white);animation:bob 2s ease-in-out infinite}.char:last-child{animation-delay:.45s}
@keyframes bob{50%{transform:translateY(-9px) rotate(-3deg)}}
.panel{background:#fffdfd;border:5px solid #f0bfd7;border-radius:30px;margin-top:-4px;position:relative;z-index:5;padding:14px 14px 20px;box-shadow:0 12px 30px #5e7c5520}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#fff5fb;border:2px solid #efd3e3;border-radius:17px;text-align:center;padding:7px 2px;font-size:12px;font-weight:bold}.stat b{display:block;font-size:21px;color:#95527e}
.mode{display:flex;gap:9px;margin:12px 0}.mode button{flex:1;border:3px solid transparent;border-radius:18px;padding:11px;background:#eee4ff;color:#684c78;font:inherit;font-weight:bold;cursor:pointer}.mode .active{background:#ffd5e7;border-color:#e69cbd}
.progress{height:13px;background:#f0e9f2;border-radius:20px;overflow:hidden;margin:0 5px 13px}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff8fbd,#a88ae6);transition:.4s}
.question{background:linear-gradient(135deg,#fff9fd,#fffdf1);border:3px solid #efdce7;border-radius:25px;text-align:center;padding:12px 10px 17px}.badge{display:inline-block;background:#fff0b5;border:2px solid #e2c55b;border-radius:20px;padding:5px 12px;font-weight:bold}.message{min-height:29px;color:#965079;font-weight:bold;font-size:18px;margin:7px 0}.problem{font-size:clamp(48px,13vw,82px);font-weight:900;line-height:1;margin:9px 0 20px;color:#4f3854}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:500px;margin:auto}.answer{min-height:76px;border-radius:22px;border:3px solid #d9c1e8;background:#f0e3ff;box-shadow:0 5px #c2a5d4;color:#573d69;font-size:32px;font-weight:bold;cursor:pointer}.answer:active{transform:translateY(3px);box-shadow:0 2px #c2a5d4}.answer.correct{background:#d7f5dc;border-color:#86cf96;box-shadow:0 5px #70b27d;animation:pop .4s}.answer.wrong{background:#ffe0e8;border-color:#ed9aaa;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.next{display:none;margin:16px auto 0;border:0;border-radius:20px;background:#c85f9f;color:white;padding:13px 25px;font-size:19px;font-weight:bold;box-shadow:0 5px #914275;cursor:pointer}
.reward{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border-radius:20px;padding:11px;background:#fff7d4;border:2px dashed #dfc05d;text-align:center}.box.green{background:#e5f7e8;border-color:#a8d6af}.box b{display:block}.stickers,.garden{font-size:27px;min-height:34px;letter-spacing:3px}
.petal{position:fixed;z-index:20;pointer-events:none;font-size:27px;animation:fall 1.3s ease-out forwards}@keyframes fall{to{transform:translateY(90vh) rotate(500deg);opacity:0}}
.modal{position:fixed;inset:0;background:#fff9;display:none;align-items:center;justify-content:center;z-index:30}.modal.show{display:flex}.modalin{width:min(440px,90%);background:#fff;border:5px solid #f0b8d4;border-radius:30px;padding:24px;text-align:center;box-shadow:0 15px 50px #5d416050}.modalin .big{font-size:62px}.modalin h2{color:#8c4876;font-size:29px;margin:5px}.modalin button{background:#c65e9d;color:#fff;border:0;border-radius:18px;padding:13px 25px;font:inherit;font-weight:bold}
@media(max-width:450px){.sky{height:205px}.char{font-size:60px}.cast{bottom:22px}.answer{min-height:68px}.reward{grid-template-columns:1fr}}
</style></head>
<body>
<div class="wrap">
<div class="top"><button class="home" onclick="location.href='../'">⌂</button><div class="sign"><b>🌸 Magical Math Garden 🌸</b><small>Mitsuki's happy little math adventure</small></div><button class="music" id="music" onclick="toggleMusic()">♫</button></div>
<div class="sky"><div class="sun">☀️</div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="ground"></div><div class="f f1">🌷</div><div class="f f2">🌸</div><div class="f f3">🌼</div><div class="f f4">🌷</div><div class="cast"><span class="char">🐰🌸</span><span class="char">😈🖤</span></div></div>
<div class="panel">
<div class="stats"><div class="stat">⭐ Stars<b id="score">0</b></div><div class="stat">🔥 Streak<b id="streak">0</b></div><div class="stat">🌷 Flowers<b id="flowers">0</b></div><div class="stat">🏆 Level<b id="level">1</b></div></div>
<div class="mode"><button id="add" class="active" onclick="setMode('add')">➕ Addition</button><button id="sub" onclick="setMode('sub')">➖ Subtraction</button></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question"><span class="badge" id="badge">🌱 Garden Level 1</span><div class="message" id="message">Let's grow some flowers! 🌷</div><div class="problem" id="problem">2 + 3 = ?</div><div class="answers" id="answers"></div><button class="next" id="next" onclick="newProblem()">Next Adventure! 💕</button></div>
<div class="reward"><div class="box"><b>🎀 Sticker Album</b><div class="stickers" id="stickers">—</div></div><div class="box green"><b>🌷 Flower Garden</b><div class="garden" id="garden">🌱</div></div></div>
</div></div>
<div class="modal" id="modal"><div class="modalin"><div class="big">🌸🐰⭐🖤</div><h2>Garden Level Up!</h2><p id="uptext">Your garden is growing!</p><button onclick="closeModal()">Keep Playing! 🎀</button></div></div>
<script>
let mode='add',a=2,b=3,answer=5,locked=false,score=0,streak=0,flowers=0,level=1,round=0,stickers=[];
const good=['Amazing! 🌸','You got it! 💕','Super math! ⭐','Wonderful! 🎀','Perfect! 🖤','Math magic! ✨'];
const tryagain=['Good try! 🐰','Almost! Try again! 🌷','You can do it! 💕','Let’s try that one again! 🌸'];
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function setMode(m){mode=m;document.getElementById('add').classList.toggle('active',m==='add');document.getElementById('sub').classList.toggle('active',m==='sub');newProblem()}
function maxNum(){return level===1?5:level===2?7:9}
function newProblem(){
 locked=false;document.getElementById('next').style.display='none';document.getElementById('message').textContent='Pick your answer! 🌷';
 let mx=maxNum();
 if(mode==='add'){a=rand(0,mx);b=rand(0,mx-a);answer=a+b}else{a=rand(0,mx);b=rand(0,a);answer=a-b}
 document.getElementById('problem').textContent=`${a} ${mode==='add'?'+':'−'} ${b} = ?`;
 let s=new Set([answer]);while(s.size<4){let n=answer+rand(1,3)*(Math.random()<.5?-1:1);if(n>=0&&n<=9)s.add(n)}
 document.getElementById('answers').innerHTML=[...s].sort(()=>Math.random()-.5).map(n=>`<button class="answer" onclick="check(${n},this)">${n}</button>`).join('');
 update()
}
function check(n,btn){
 if(locked)return;
 if(n!==answer){btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),400);streak=0;document.getElementById('message').textContent=tryagain[rand(0,tryagain.length-1)];update();return}
 locked=true;score++;streak++;flowers++;round++;btn.classList.add('correct');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);document.getElementById('message').textContent=good[rand(0,good.length-1)];
 if(streak%3===0)earnSticker();if(round>=5){round=0;if(level<3){level++;showLevel()}}
 update();celebrate();document.getElementById('next').style.display='inline-block'
}
function earnSticker(){const p=['🌸','🎀','🍓','⭐','🩷','🦄','🌈','🍭','🐰','🖤','✨','🌷'];stickers.push(p[(stickers.length)%p.length]);document.getElementById('stickers').textContent=stickers.join(' ')}
function update(){document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;document.getElementById('flowers').textContent=flowers;document.getElementById('level').textContent=level;document.getElementById('badge').textContent=`🌱 Garden Level ${level}`;document.getElementById('garden').textContent='🌱'+'🌷'.repeat(Math.min(flowers,10))+(flowers>10?'🌸':'');document.getElementById('bar').style.width=(round/5*100)+'%'}
function showLevel(){document.getElementById('uptext').textContent=level===2?'Numbers are getting a little bigger! 🌷':'You reached the Magical Math Garden! 🌈';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function celebrate(){const bits=['🌸','⭐','🎀','💕','✨','🌷'];for(let i=0;i<18;i++){let x=document.createElement('span');x.className='petal';x.textContent=bits[rand(0,bits.length-1)];x.style.left=rand(2,98)+'%';x.style.top=rand(5,25)+'%';x.style.animationDelay=(Math.random()*.2)+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),1500)}}
function toggleMusic(){let b=document.getElementById('music');b.classList.toggle('off');b.textContent=b.classList.contains('off')?'🔇':'♫'}
newProblem()
</script></body></html>
